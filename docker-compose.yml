services:
  api:
    build: .
    container_name: specpulse-api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env.example
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  demo-target:
    build: .
    command: uvicorn examples.demo_target:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"

  postgres:
    image: postgres:16-alpine
    container_name: specpulse-postgres
    environment:
      POSTGRES_USER: specpulse
      POSTGRES_PASSWORD: specpulse
      POSTGRES_DB: specpulse
    volumes:
      - specpulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specpulse -d specpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: specpulse-redis
    command: redis-server --appendonly yes
    volumes:
      - specpulse-redis-data:/data

volumes:
  specpulse-postgres-data:
  specpulse-redis-data:
